name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: linux-amd64
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make test
      - name: Name release artifact
        run: cp build/daybreak-blue.so build/daybreak-blue-${{ matrix.artifact }}.so
      - name: Package Plugin Store archive
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          archive="daybreak-blue_${version}_${{ matrix.artifact }}.zip"
          (cd build && zip "$archive" daybreak-blue.so)
      - uses: actions/upload-artifact@v4
        with:
          name: daybreak-blue-${{ matrix.artifact }}
          path: |
            build/daybreak-blue-${{ matrix.artifact }}.so
            build/daybreak-blue_*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: daybreak-blue-*
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          sha256sum daybreak-blue_*.zip > checksums.txt
          gh release create "$GITHUB_REF_NAME" \
            daybreak-blue-linux-amd64.so \
            daybreak-blue-linux-arm64.so \
            daybreak-blue_*.zip \
            checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes

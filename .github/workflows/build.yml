name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make test

  plugin:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    goos: linux,   goarch: amd64, lib: daybreak-blue.so,    cc: "cc -O2 -Wall -Wextra -Werror -Wpedantic -fPIC -shared" }
          - { runner: ubuntu-24.04-arm, goos: linux,   goarch: arm64, lib: daybreak-blue.so,    cc: "cc -O2 -Wall -Wextra -Werror -Wpedantic -fPIC -shared" }
          - { runner: macos-latest,     goos: darwin,  goarch: arm64, lib: daybreak-blue.dylib, cc: "clang -arch arm64 -O2 -Wall -Wextra -Werror -Wpedantic -dynamiclib" }
          - { runner: macos-latest,     goos: darwin,  goarch: amd64, lib: daybreak-blue.dylib, cc: "clang -arch x86_64 -O2 -Wall -Wextra -Werror -Wpedantic -dynamiclib" }
          - { runner: windows-latest,   goos: windows, goarch: amd64, lib: daybreak-blue.dll,   cc: "gcc -O2 -Wall -Wextra -Werror -Wpedantic -shared" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build shared library
        shell: bash
        run: |
          mkdir -p build
          ${{ matrix.cc }} -o "build/${{ matrix.lib }}" src/plugin.c
          test -s "build/${{ matrix.lib }}"
      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/${{ matrix.lib }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package Plugin Store archives and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for dir in artifacts/lib-*; do
            target="$(basename "$dir")"
            rest="${target#lib-}"
            goos="${rest%-*}"
            goarch="${rest##*-}"
            zip -9 -j "dist/daybreak-blue_${version}_${goos}_${goarch}.zip" "$dir"/*
          done
          cd dist
          sha256sum daybreak-blue_*.zip > checksums.txt
          cat checksums.txt
          gh release create "$GITHUB_REF_NAME" \
            daybreak-blue_*.zip \
            checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes
